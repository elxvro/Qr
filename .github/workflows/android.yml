name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elxvro-scan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/elxvro-upload.jks"

      - name: Test, lint and build release
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/elxvro-upload.jks
        run: gradle testDebugUnitTest lintRelease assembleDebug assembleRelease bundleRelease --stacktrace --console=plain --build-cache

      - name: Verify production configuration
        run: |
          set -euo pipefail
          grep -q 'targetSdk = 37' app/build.gradle.kts
          grep -q 'versionName = "5.0.0"' app/build.gradle.kts
          ! grep -R --line-number -E 'ReviewerAccessManager|ProTestMode|PRO TEST aktif' app/src/main/java
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK"
          unzip -p "$APK" 'classes*.dex' | strings > /tmp/release-dex-strings.txt
          ! grep -q 'ca-app-pub-3940256099942544' /tmp/release-dex-strings.txt
          grep -q 'ca-app-pub-1306515175084399/6105367552' /tmp/release-dex-strings.txt
          grep -q 'ca-app-pub-1306515175084399/8914618865' /tmp/release-dex-strings.txt
          grep -q 'com.android.vending.BILLING' app/src/main/AndroidManifest.xml
          grep -q 'com.google.android.gms.permission.AD_ID' app/src/main/AndroidManifest.xml

      - name: Record release signing status
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "SIGNED_WITH_UPLOAD_KEY=true" > RELEASE-SIGNING-STATUS.txt
          else
            echo "SIGNED_WITH_UPLOAD_KEY=false" > RELEASE-SIGNING-STATUS.txt
          fi

      - name: Package source ZIP
        run: git archive --format=zip --output=ELXVRO-Scan-v5.0.0-source.zip HEAD

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Scan-v5.0.0-release-package
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/lint-results-release.html
            ELXVRO-Scan-v5.0.0-source.zip
            .github/workflows/android.yml
            RELEASE-SIGNING-STATUS.txt
          if-no-files-found: error
          retention-days: 14
