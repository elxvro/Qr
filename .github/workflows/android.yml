name: Android APK

on:
  push:
    branches: [ main, feature/pro-qr-card-local ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-test.log
      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Scan-v2.1.0-test-log
          path: unit-test.log
          if-no-files-found: error
      - name: Fail on unit test error
        if: steps.unit_tests.outcome == 'failure'
        run: exit 1
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --console=plain
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Scan-v2.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
