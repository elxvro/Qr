name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elxvro-scan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test, lint and build release
        run: gradle testDebugUnitTest lintRelease assembleDebug assembleRelease bundleRelease --stacktrace --console=plain --build-cache
      - name: Package source ZIP
        run: git archive --format=zip --output=ELXVRO-Scan-v3.8.1-source.zip HEAD
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Scan-v3.8.1-release-package
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/lint-results-release.html
            ELXVRO-Scan-v3.8.1-source.zip
            .github/workflows/android.yml
          if-no-files-found: error
          retention-days: 14
